# Déploiement Netlify : le site est reconstruit à chaque modification enregistrée depuis /admin.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# L'interface d'administration (public/admin/) est servie telle quelle sur /admin :
# aucune redirection nécessaire, sa configuration est chargée par une adresse absolue.
